[build]
  command = "bunx prisma db push && bun run build"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
  BUN_VERSION = "1.3.5"
  
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".svelte-kit", "node_modules/.vite", "node_modules/.cache"]

[functions."cleanup-flash-texts"]
  schedule = "@hourly"

# Android App Links verification requires the assetlinks file to be served
# over HTTPS as application/json with NO redirects (no www->apex, no http->https).
# A 301 here breaks verification with no visible error.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[images]
  # Optional: If you ever test CDN as fallback
  # remote_images = ["https://example-external-domain.com/.*"]